<meta charset="utf-8">
<title>달빛장터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 단일 다크 테마 (게임 화면과 동일한 밤 시장 톤) */
:root { --bg: #171A23; --panel: #252A35; --accent: #FFB45C; --text: #FFF5E9; --sub: #B9B5B0; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
body { font-family: "Noto Sans KR", system-ui, sans-serif; }
#canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
#boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
#boot h1 { margin: 0; font-size: 34px; color: var(--accent); letter-spacing: 0.02em; }
#boot p { margin: 0; color: var(--sub); font-size: 15px; max-width: 32ch; line-height: 1.5; }
.moon { width: 56px; height: 56px; border-radius: 50%; background: #FFF1B8; box-shadow: 0 0 40px rgba(255, 241, 184, 0.45); position: relative; }
.moon::after { content: ""; position: absolute; width: 50px; height: 50px; border-radius: 50%; background: var(--bg); top: -6px; left: 14px; }
.bar { width: min(260px, 70vw); height: 10px; border-radius: 5px; background: var(--panel); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
#err { color: #E97858; }
</style>
<canvas id="canvas" tabindex="0">브라우저가 캔버스를 지원하지 않습니다.</canvas>
<div id="boot">
  <div class="moon" aria-hidden="true"></div>
  <h1>달빛장터</h1>
  <p id="status">시장 문을 여는 중… (처음 한 번은 약 45MB를 받습니다)</p>
  <div class="bar"><span id="bar"></span></div>
  <p id="err" hidden></p>
</div>
<script>
// 엔진(wasm)은 게시 파일 크기 제한 때문에 조각으로 나눠 올렸다. 조각을 받아 하나로 합쳐 엔진에 넘긴다.
(function () {
  const PARTS = __PARTS__;
  const TOTAL = __TOTAL__;
  const realFetch = window.fetch.bind(window);
  const bar = document.getElementById('bar');
  let wasmPromise = null;
  function loadWasm() {
    if (!wasmPromise) {
      let done = 0;
      wasmPromise = Promise.all(PARTS.map(function (p) {
        return realFetch(p).then(function (r) {
          if (!r.ok) throw new Error(p + ' ' + r.status);
          return r.arrayBuffer();
        }).then(function (b) {
          done += b.byteLength;
          bar.style.width = Math.min(100, Math.round(done / TOTAL * 100)) + '%';
          return b;
        });
      })).then(function (bufs) {
        return new Blob(bufs, { type: 'application/wasm' });
      });
    }
    return wasmPromise;
  }
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (/index\.wasm(\?|$)/.test(url)) {
      return loadWasm().then(function (blob) {
        return new Response(blob, { status: 200, headers: { 'Content-Type': 'application/wasm', 'Content-Length': String(blob.size) } });
      });
    }
    if (/index\.pck(\?|$)/.test(url)) {
      return realFetch('index.pck.wasm', init);
    }
    return realFetch(input, init);
  };
})();
</script>
<script>
__GODOT_JS__
</script>
<script>
(function () {
  const GODOT_CONFIG = __CONFIG__;
  const statusEl = document.getElementById('status');
  const errEl = document.getElementById('err');
  function fail(msg) {
    errEl.hidden = false;
    errEl.textContent = '실행하지 못했습니다: ' + msg;
  }
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) {
    fail('이 브라우저에 필요한 기능이 없습니다 (' + missing.join(', ') + ').');
    return;
  }
  const engine = new Engine(GODOT_CONFIG);
  engine.startGame({
    onProgress: function (current, total) {
      if (total > 0) statusEl.textContent = '시장 문을 여는 중… ' + Math.round(current / total * 100) + '%';
    },
  }).then(function () {
    document.getElementById('boot').hidden = true;
  }, function (e) {
    fail(e && e.message ? e.message : String(e));
  });
})();
</script>
